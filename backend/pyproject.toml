[project]
name = "foodloop-backend"
version = "0.1.0"
description = "FoodLoop — agentic AI food recovery platform (backend)"
requires-python = ">=3.12,<3.13"

# NOTE: these version floors are UNVERIFIED. They were written without access to
# PyPI, so `uv sync` may need to adjust them. If a package fails to resolve,
# relax its floor rather than pinning Python to a different minor version.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary,pool]>=3.2",
    "geoalchemy2>=0.15",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.1",                       # passlib 1.7.4 is incompatible with bcrypt>=4.1
    "python-multipart>=0.0.12",
    "pyyaml>=6.0",
    "shapely>=2.0",
    "email-validator>=2.3.0",
]

[project.optional-dependencies]
# Installed from Day 4 onward. Kept separate so Day 1-3 setup cannot be blocked
# by a LangGraph resolution problem.
agents = [
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0",
]

# Only needed for a real model. The default (mock) runs offline with no model
# and no key, so this stays optional on purpose.
#   anthropic -> LLM_PROVIDER=anthropic (needs a Console API key)
#   httpx     -> LLM_PROVIDER=ollama    (needs Ollama running locally)
llm = [
    "anthropic>=0.40",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "types-passlib>=1.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]   # FastAPI Depends() in defaults is idiomatic

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: needs a live PostGIS database",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
